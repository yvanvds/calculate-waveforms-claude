name: Controles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Opmaak en controle
        run: npm run lint

      - name: Tests van de werking
        run: npm test

      - name: Browser voor Playwright installeren
        run: npx playwright install --with-deps chromium

      - name: Tests met de echte app
        run: npm run test:e2e

      - name: Bouwen
        run: npm run build
